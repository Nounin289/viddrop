<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VidSave – تحميل الفيديوهات</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
<style>
  /* ══════════════════════════════════════
     VARIABLES & RESET
  ══════════════════════════════════════ */
  :root {
    --bg:        #0c0e0a;
    --surface:   #131610;
    --card:      #1a1e16;
    --border:    #2a3022;
    --accent:    #f97316;
    --accent2:   #10d9a0;
    --green:     #10d9a0;
    --red:       #ff4f6b;
    --text:      #eef2e8;
    --muted:     #6b7a5e;
    --radius:    18px;
    --shadow:    0 8px 40px rgba(0,0,0,0.45);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ══════════════════════════════════════
     BACKGROUND GLOW
  ══════════════════════════════════════ */
  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(249,115,22,.10) 0%, transparent 70%),
      radial-gradient(ellipse 50% 35% at 80% 80%, rgba(16,217,160,.08) 0%, transparent 70%);
  }

  /* ══════════════════════════════════════
     LAYOUT
  ══════════════════════════════════════ */
  .container {
    position: relative; z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }

  /* ══════════════════════════════════════
     HEADER
  ══════════════════════════════════════ */
  header {
    text-align: center;
    padding: 52px 0 36px;
  }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 2rem; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: grid; place-items: center;
    -webkit-text-fill-color: white;
    font-size: 1.3rem; flex-shrink: 0;
  }
  .tagline {
    margin-top: 10px;
    color: var(--muted);
    font-size: .97rem;
    font-weight: 400;
  }

  /* ══════════════════════════════════════
     PLATFORMS STRIP
  ══════════════════════════════════════ */
  .platforms {
    display: flex; justify-content: center; gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .platform-badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 6px 14px;
    font-size: .82rem;
    font-weight: 600;
    transition: border-color .2s, transform .2s;
  }
  .platform-badge:hover { border-color: var(--accent); transform: translateY(-2px); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-tt  { background: #69c9d0; }
  .dot-yt  { background: #ff0000; }
  .dot-ig  { background: #e1306c; }
  .dot-fb  { background: #1877f2; }

  /* ══════════════════════════════════════
     MAIN CARD
  ══════════════════════════════════════ */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  /* INPUT ROW */
  .input-row {
    display: flex; gap: 10px;
    flex-direction: column;
  }
  .url-input {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: .95rem;
    outline: none;
    transition: border-color .25s, box-shadow .25s;
    direction: ltr;
    text-align: left;
    width: 100%;
  }
  .url-input::placeholder { color: var(--muted); }
  .url-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(249,115,22,.15);
  }

  .btn-main {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity .2s, transform .15s;
    white-space: nowrap;
    width: 100%;
  }
  .btn-main:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
  .btn-main:active:not(:disabled) { transform: scale(.97); }
  .btn-main:disabled { opacity: .5; cursor: not-allowed; }

  /* ══════════════════════════════════════
     LOADER
  ══════════════════════════════════════ */
  .loader { display: none; text-align: center; padding: 24px 0; }
  .loader.active { display: block; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { color: var(--muted); font-size: .9rem; }

  /* ══════════════════════════════════════
     ERROR / SUCCESS ALERTS
  ══════════════════════════════════════ */
  .alert {
    display: none;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: .9rem;
    font-weight: 600;
    margin-top: 16px;
    line-height: 1.5;
  }
  .alert.error  { display: block; background: rgba(255,79,107,.1); border: 1px solid rgba(255,79,107,.3); color: #ff7a90; }
  .alert.info   { display: block; background: rgba(249,115,22,.1); border: 1px solid rgba(249,115,22,.3); color: #fbad74; }

  /* ══════════════════════════════════════
     RESULTS
  ══════════════════════════════════════ */
  .results { display: none; margin-top: 20px; }
  .results.active { display: block; }

  .result-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .thumb {
    width: 72px; height: 72px; border-radius: 10px;
    object-fit: cover;
    background: var(--surface);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .thumb-placeholder {
    width: 72px; height: 72px; border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    font-size: 1.8rem;
    flex-shrink: 0;
  }
  .result-meta h3 {
    font-size: .95rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .result-meta .source-tag {
    font-size: .77rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    color: var(--muted);
    display: inline-block;
  }

  /* QUALITY BUTTONS */
  .quality-label {
    font-size: .82rem; color: var(--muted); margin-bottom: 10px; font-weight: 600;
  }
  .quality-list {
    display: flex; flex-direction: column; gap: 9px;
  }
  .dl-btn {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .dl-btn:hover { border-color: var(--green); background: rgba(34,216,143,.06); transform: translateX(-2px); }
  .dl-btn:active { transform: scale(.97); }
  .dl-btn .quality-info { display: flex; align-items: center; gap: 10px; }
  .quality-badge {
    background: rgba(249,115,22,.15);
    color: var(--accent);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: .78rem;
  }
  .dl-icon { font-size: 1.1rem; }

  /* audio only badge */
  .quality-badge.audio { background: rgba(162,89,255,.15); color: var(--accent2); }

  /* ══════════════════════════════════════
     INFO BOX
  ══════════════════════════════════════ */
  .info-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 20px;
  }
  .info-box h2 {
    font-size: 1rem; font-weight: 700; margin-bottom: 14px;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .info-box ul {
    list-style: none; display: flex; flex-direction: column; gap: 9px;
  }
  .info-box li {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: .88rem; color: var(--muted); line-height: 1.5;
  }
  .info-box li .ico { font-size: 1rem; margin-top: 1px; flex-shrink: 0; }

  /* ══════════════════════════════════════
     FOOTER
  ══════════════════════════════════════ */
  footer {
    text-align: center;
    color: var(--muted);
    font-size: .78rem;
    padding-top: 10px;
    line-height: 1.8;
  }

  /* ══════════════════════════════════════
     RESPONSIVE
  ══════════════════════════════════════ */
  @media (min-width: 480px) {
    .input-row { flex-direction: row; }
    .btn-main  { width: auto; }
    .url-input { text-align: right; direction: ltr; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-icon">▼</div>
      VidSave
    </div>
    <p class="tagline">حمّل الفيديوهات مجاناً بدون علامة مائية</p>
  </header>

  <!-- PLATFORMS STRIP -->
  <div class="platforms">
    <div class="platform-badge"><span class="dot dot-tt"></span>TikTok</div>
    <div class="platform-badge"><span class="dot dot-yt"></span>YouTube</div>
    <div class="platform-badge"><span class="dot dot-ig"></span>Instagram</div>
    <div class="platform-badge"><span class="dot dot-fb"></span>Facebook</div>
  </div>

  <!-- MAIN CARD -->
  <div class="card">
    <div class="input-row">
      <input
        class="url-input"
        id="urlInput"
        type="url"
        placeholder="الصق رابط الفيديو هنا..."
        autocomplete="off"
        spellcheck="false"
      />
      <button class="btn-main" id="fetchBtn" onclick="handleFetch()">
        <span>🔍</span> تحليل
      </button>
    </div>

    <!-- ALERT BOX -->
    <div class="alert" id="alertBox"></div>

    <!-- LOADER -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>جارٍ تحليل الرابط…</p>
    </div>

    <!-- RESULTS -->
    <div class="results" id="results">
      <div class="result-header">
        <div class="thumb-placeholder" id="thumbPlaceholder">🎬</div>
        <img class="thumb" id="thumbImg" src="" alt="" style="display:none" />
        <div class="result-meta">
          <h3 id="videoTitle">—</h3>
          <span class="source-tag" id="sourceTag"></span>
        </div>
      </div>
      <p class="quality-label">اختر الجودة للتحميل:</p>
      <div class="quality-list" id="qualityList"></div>
    </div>
  </div>

  <footer>
    VidSave · للاستخدام الشخصي فقط · احترم حقوق الملكية الفكرية
  </footer>

</div><!-- /container -->

<script>
/* ═══════════════════════════════════════════════════
   VIDSAVE — MAIN LOGIC
   يستخدم cobalt.tools API (مجاني ومفتوح المصدر)
   وkeepit API كبديل
═══════════════════════════════════════════════════ */

const COBALT_API = "https://api.cobalt.tools/";

// ─── Detect platform from URL ───────────────────
function detectPlatform(url) {
  if (/tiktok\.com/i.test(url))     return "TikTok";
  if (/youtube\.com|youtu\.be/i.test(url)) return "YouTube";
  if (/instagram\.com/i.test(url))  return "Instagram";
  if (/facebook\.com|fb\.watch/i.test(url)) return "Facebook";
  if (/twitter\.com|x\.com/i.test(url)) return "Twitter / X";
  if (/reddit\.com/i.test(url))     return "Reddit";
  if (/vimeo\.com/i.test(url))      return "Vimeo";
  if (/twitch\.tv/i.test(url))      return "Twitch";
  if (/soundcloud\.com/i.test(url)) return "SoundCloud";
  return "Unknown";
}

// ─── Show / Hide helpers ─────────────────────────
function showLoader(show) {
  document.getElementById("loader").classList.toggle("active", show);
}
function showResults(show) {
  document.getElementById("results").classList.toggle("active", show);
}
function showAlert(msg, type = "error") {
  const el = document.getElementById("alertBox");
  el.textContent = msg;
  el.className = "alert " + type;
}
function clearAlert() {
  const el = document.getElementById("alertBox");
  el.className = "alert";
  el.textContent = "";
}
function setFetchBtn(loading) {
  const btn = document.getElementById("fetchBtn");
  btn.disabled = loading;
  btn.innerHTML = loading ? "⏳ جارٍ التحليل…" : "<span>🔍</span> تحليل";
}

// ─── Build download buttons ──────────────────────
function buildButtons(links) {
  const list = document.getElementById("qualityList");
  list.innerHTML = "";
  links.forEach(item => {
    const a = document.createElement("a");
    a.href    = item.url;
    a.target  = "_blank";
    a.rel     = "noopener noreferrer";
    a.className = "dl-btn";
    const isAudio = item.type === "audio";
    a.innerHTML = `
      <div class="quality-info">
        <span>${isAudio ? "🎵" : "🎬"}</span>
        <span>${item.label}</span>
        <span class="quality-badge ${isAudio ? "audio" : ""}">${isAudio ? "صوت فقط" : item.quality || "فيديو"}</span>
      </div>
      <span class="dl-icon">⬇</span>
    `;
    // Try direct download first, fallback to open tab
    a.addEventListener("click", (e) => {
      e.preventDefault();
      triggerDownload(item.url, item.label);
    });
    list.appendChild(a);
  });
}

// ─── Trigger download ────────────────────────────
function triggerDownload(url, filename) {
  // Attempt direct download via anchor
  const a = document.createElement("a");
  a.href     = url;
  a.download = filename + ".mp4";
  a.target   = "_blank";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ─── Set thumbnail ───────────────────────────────
function setThumb(url) {
  const img  = document.getElementById("thumbImg");
  const ph   = document.getElementById("thumbPlaceholder");
  if (url) {
    img.src = url;
    img.style.display = "block";
    ph.style.display  = "none";
    img.onerror = () => {
      img.style.display = "none";
      ph.style.display  = "grid";
    };
  } else {
    img.style.display = "none";
    ph.style.display  = "grid";
  }
}

/* ═══════════════════════════════════════════════════
   COBALT API
   Docs: https://github.com/imputnet/cobalt
   Public instance: api.cobalt.tools (لا يحتاج مفتاح)
═══════════════════════════════════════════════════ */
async function fetchCobalt(videoUrl) {
  const res = await fetch(COBALT_API, {
    method: "POST",
    headers: {
      "Content-Type":  "application/json",
      "Accept":        "application/json"
    },
    body: JSON.stringify({ url: videoUrl })
  });
  if (!res.ok) throw new Error("فشل الاتصال بـ Cobalt API");
  return await res.json();
}

/* ═══════════════════════════════════════════════════
   KEEPIT / TIKMATE fallback for TikTok
   tikmate.online — مجاني بدون مفتاح
═══════════════════════════════════════════════════ */
async function fetchTikmate(videoUrl) {
  // tikmate public API
  const tokenRes = await fetch("https://tikmate.online/api/", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "url=" + encodeURIComponent(videoUrl)
  });
  if (!tokenRes.ok) throw new Error("فشل tikmate");
  const data = await tokenRes.json();
  return data;
}

/* ═══════════════════════════════════════════════════
   MAIN HANDLER
═══════════════════════════════════════════════════ */
async function handleFetch() {
  clearAlert();
  showResults(false);

  const raw = document.getElementById("urlInput").value.trim();
  if (!raw) {
    showAlert("⚠️ الرجاء لصق رابط الفيديو أولاً");
    return;
  }
  let url;
  try { url = new URL(raw); }
  catch { showAlert("⚠️ الرابط غير صحيح. تأكد أنه يبدأ بـ https://"); return; }

  const platform = detectPlatform(raw);
  if (platform === "Unknown") {
    showAlert("⚠️ المنصة غير مدعومة. المنصات المدعومة: TikTok، YouTube، Instagram، Facebook");
    return;
  }

  setFetchBtn(true);
  showLoader(true);

  try {
    const data = await fetchCobalt(raw);

    showLoader(false);

    // ── Cobalt returns status: stream / redirect / picker / error
    if (data.status === "error") {
      throw new Error(data.error?.code || "خطأ غير معروف من Cobalt");
    }

    document.getElementById("videoTitle").textContent =
      data.meta?.title || platform + " Video";
    document.getElementById("sourceTag").textContent = platform;
    setThumb(data.meta?.thumbnail || null);

    let links = [];

    if (data.status === "stream" || data.status === "redirect") {
      // Single URL returned
      links.push({ url: data.url, label: "تحميل الفيديو", quality: "HD", type: "video" });
      if (data.audio) {
        links.push({ url: data.audio, label: "تحميل الصوت فقط", quality: "MP3", type: "audio" });
      }
    } else if (data.status === "picker") {
      // Multiple qualities / items
      (data.picker || []).forEach((item, i) => {
        links.push({
          url:     item.url,
          label:   item.type === "photo" ? `صورة ${i+1}` : `جودة ${i+1}`,
          quality: item.quality || (item.type === "audio" ? "صوت" : "فيديو"),
          type:    item.type || "video"
        });
      });
    }

    if (links.length === 0) {
      throw new Error("لم يتم العثور على روابط للتحميل");
    }

    buildButtons(links);
    showResults(true);

  } catch (err) {
    showLoader(false);
    console.warn("Cobalt failed:", err.message);

    // ── Fallback: build a manual redirect link ──────────
    // Since browser CORS can block some APIs, offer a manual solution
    document.getElementById("videoTitle").textContent = platform + " — فيديو";
    document.getElementById("sourceTag").textContent = platform;
    setThumb(null);

    const fallbackLinks = buildFallbackLinks(raw, platform);
    if (fallbackLinks.length > 0) {
      buildButtons(fallbackLinks);
      showResults(true);
      showAlert(
        "⚠️ تعذّر التحليل التلقائي. جرّب الروابط أدناه أو استخدم موقع بديل.",
        "info"
      );
    } else {
      showAlert(
        "❌ تعذّر تحليل الرابط: " + err.message +
        "\n\nتأكد من صحة الرابط أو جرّب مواقع: snaptik.app أو y2mate.com"
      );
    }
  }

  setFetchBtn(false);
}

/* ═══════════════════════════════════════════════════
   FALLBACK LINKS — يفتح خدمات خارجية موثوقة
═══════════════════════════════════════════════════ */
function buildFallbackLinks(videoUrl, platform) {
  const encoded = encodeURIComponent(videoUrl);
  const links = [];

  if (platform === "TikTok") {
    links.push({ url: "https://snaptik.app/ar#" + encoded, label: "SnaptTik (TikTok بدون علامة)", quality: "HD", type: "video" });
    links.push({ url: "https://tikmate.online/#" + encoded, label: "TikMate", quality: "HD", type: "video" });
  } else if (platform === "YouTube") {
    links.push({ url: "https://y2mate.com/youtube/" + encoded, label: "Y2Mate (YouTube)", quality: "HD", type: "video" });
    links.push({ url: "https://cobalt.tools/#" + videoUrl, label: "Cobalt Tools", quality: "HD", type: "video" });
  } else if (platform === "Instagram") {
    links.push({ url: "https://snapinsta.app/ar/#" + encoded, label: "SnapInsta", quality: "HD", type: "video" });
  } else if (platform === "Facebook") {
    links.push({ url: "https://fdown.net/index.php?URLz=" + encoded, label: "FDown (Facebook)", quality: "HD", type: "video" });
    links.push({ url: "https://getfvid.com/downloader#" + encoded, label: "GetFVid", quality: "HD", type: "video" });
  } else {
    links.push({ url: "https://cobalt.tools/#" + videoUrl, label: "Cobalt Tools (عام)", quality: "HD", type: "video" });
  }

  return links;
}

/* ══ Allow pressing Enter in input ══ */
document.getElementById("urlInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleFetch();
});

/* ══ Auto-paste from clipboard on focus if empty ══ */
document.getElementById("urlInput").addEventListener("focus", async () => {
  const input = document.getElementById("urlInput");
  if (input.value.trim() !== "") return;
  try {
    const text = await navigator.clipboard.readText();
    if (/^https?:\/\//i.test(text)) {
      input.value = text;
    }
  } catch {}
});
</script>

</body>
</html>
